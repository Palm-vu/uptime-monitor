name: Production uptime

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      alert_test:
        description: 'Intentionally fail this run to verify failure email'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SITE_URL: ${{ secrets.PRODUCTION_SITE_URL }}
      HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
      ALERT_TEST: ${{ inputs.alert_test }}
    steps:
      - name: Check production site and API health
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ALERT_TEST" == "true" ]]; then
            echo 'Intentional failure for email alert verification'
            exit 1
          fi
          if [[ -z "$SITE_URL" || -z "$HEALTH_URL" ]]; then
            echo 'Required URL secrets are missing'
            exit 1
          fi
          site_code=$(curl --location --silent --max-time 15 --retry 1 --retry-delay 2 --output /dev/null --write-out '%{http_code}' "$SITE_URL") || {
            echo 'Production site request failed'
            exit 1
          }
          if [[ "$site_code" != "200" ]]; then
            echo "Production site returned HTTP $site_code"
            exit 1
          fi
          health_code=$(curl --location --silent --max-time 15 --retry 1 --retry-delay 2 --output health.json --write-out '%{http_code}' "$HEALTH_URL") || {
            echo 'Health request failed'
            exit 1
          }
          if [[ "$health_code" != "200" ]]; then
            echo "API health returned HTTP $health_code"
            exit 1
          fi
          if ! jq -e '.ok == true' health.json > /dev/null 2>&1; then
            echo 'Health response did not report a healthy state'
            exit 1
          fi
          echo 'Production site and API health passed'
